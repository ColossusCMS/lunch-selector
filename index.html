<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 점심 뭐 먹지</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">
  <script>
    // js/theme.js와 같은 키. 화면을 그리기 전에 적용해 테마가 깜빡이지 않게 한다.
    try {
      const theme = localStorage.getItem('lunch-selector:theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* 저장소를 못 쓰면 시스템 설정을 따른다 */ }
  </script>
  <link rel="stylesheet" href="css/style.css?v=d8f5ec889ac9">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div id="modes" class="modes" role="group" aria-label="고를 것" hidden></div>
      <div id="theme" class="theme-switch" role="group" aria-label="화면 테마"></div>
    </div>
    <h1 id="heading"><span id="heading-text">🍱 오늘 점심 뭐 먹지?</span> <span id="app-version" class="app-version" hidden></span></h1>

    <div id="recommend-row" class="filter-row" hidden>
      <span class="filter-label" id="recommend-label">추천</span>
      <div class="chips recommend-chips" role="group" aria-labelledby="recommend-label">
        <button id="recommend-toggle" type="button" class="recommend-toggle" aria-pressed="false">🤖 AI 메뉴 추천 <span class="beta-badge">BETA</span> <span class="recommend-switch" aria-hidden="true"></span></button>
        <span id="recommend-badge" class="recommend-badge" hidden></span>
      </div>
    </div>
    <p id="recommend-message" class="recommend-message" hidden>
      <span id="recommend-summary"></span><small id="recommend-details"></small>
    </p>

    <div class="filter-row" hidden>
      <span class="filter-label" id="regions-label">지역</span>
      <div id="regions" class="chips" role="group" aria-labelledby="regions-label"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label" id="groups-label">그룹</span>
      <div id="groups" class="chips" role="group" aria-labelledby="groups-label"></div>
    </div>

    <div class="filter-row">
      <span class="filter-label" id="categories-label">업종</span>
      <div id="categories" class="chips" role="group" aria-labelledby="categories-label"></div>
    </div>

    <section class="stage" id="stage">
      <div class="card-flip" id="card-flip">
        <div class="card-back" id="card-back">
          <div class="back-inner">
            <span class="back-utensils" aria-hidden="true">🍴</span>
            <div id="spin-name" class="spin-name" aria-hidden="true">?</div>
            <div id="back-hint" class="back-hint">돌려서 오늘의 카드를 확인하세요</div>
          </div>
        </div>
        <article id="rank1" class="gacha-card big rank-1 tier-none card-front" aria-hidden="true" inert></article>
      </div>
    </section>

    <div class="spin-row">
      <label class="include-excluded"><input id="include-excluded" type="checkbox" aria-label="제외한 가게도 포함해서 돌리기" autocomplete="off" disabled> 제외 포함</label>
      <button id="spin" class="spin" type="button" disabled>🎰 돌리기</button>
    </div>

    <div class="ranks">
      <article id="rank2" class="rank" hidden></article>
      <article id="rank3" class="rank" hidden></article>
    </div>

    <div id="map" class="map" hidden></div>

    <p id="announce" class="sr-only" aria-live="polite"></p>

    <p id="message" class="message">불러오는 중...</p>
    <button id="retry" class="retry" type="button" hidden>다시 시도</button>
    <button id="startup-reload" class="retry" type="button" hidden>새로 불러오기</button>

    <footer class="footer">
      <p id="closed" class="closed" hidden></p>
      <button id="feedback-open" type="button" class="feedback-link" hidden>🤖 AI 추천 피드백</button>
      <a id="edit-link" class="edit-link" target="_blank" rel="noopener" hidden>✏️ 가게 목록 편집하기</a>
      <a id="about-link" class="about-link" target="_blank" rel="noopener" hidden>🐙 GitHub에서 소개 보기</a>
    </footer>
  </main>
  <aside id="recommend-guide" class="recommend-guide" aria-labelledby="recommend-guide-title" hidden>
    <h2 id="recommend-guide-title">🤖 AI 메뉴 추천을 켰어요</h2>
    <ul>
      <li>AI가 오늘 날씨를 보고 어울리는 업종을 골라 켜줘요</li>
      <li>지역을 바꾸면 그 지역 날씨로 다시 골라요</li>
      <li>업종 버튼은 언제든 직접 바꿀 수 있어요</li>
    </ul>
    <button id="recommend-guide-ok" type="button">확인</button>
  </aside>
  <dialog id="notice-dialog" class="rating-dialog notice-dialog" aria-labelledby="notice-title"></dialog>
  <dialog id="feedback-dialog" class="rating-dialog feedback-dialog" aria-labelledby="feedback-title"></dialog>
  <dialog id="rating-dialog" class="rating-dialog" aria-labelledby="rating-title"></dialog>
  <dialog id="exclude-dialog" class="rating-dialog" aria-labelledby="exclude-title"></dialog>
  <dialog id="reveal-dialog" class="reveal-dialog" aria-label="1순위 공개 연출" tabindex="-1"></dialog>
  <script>
    // 모듈 자체를 불러오지 못해도 오류 안내와 새로 불러오기는 동작한다.
    (function () {
      var reload = document.getElementById('startup-reload');
      function failed() {
        if (window.__lunchReady) return;
        document.getElementById('message').textContent = '화면을 불러오지 못했어요';
        reload.hidden = false;
      }
      window.__lunchStartFailed = failed;
      window.addEventListener('error', failed);
      setTimeout(failed, 8000);
      reload.addEventListener('click', function () {
        var url = new URL(location.href);
        url.searchParams.set('r', String(Date.now()));
        location.replace(url.href);
      });
    })();
  </script>
  <script type="module" src="js/app.js?v=d8f5ec889ac9" onerror="window.__lunchStartFailed()"></script>
</body>
</html>
